spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# App Properties
# Base64-encoded, at least 256 bits. Generate with: openssl rand -base64 64
bezkoder.app.jwtSecret=${JWT_SECRET}
bezkoder.app.jwtExpirationMs=86400000

# Optional: creates this login on first start if it does not exist
app.seed.username=${SEED_USERNAME:}
app.seed.password=${SEED_PASSWORD:}
